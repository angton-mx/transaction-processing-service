services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transaction_processing}
      POSTGRES_USER: ${POSTGRES_USER:-transaction_processing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transaction_processing_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - transaction-processing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  transaction-processing-postgres-data:
